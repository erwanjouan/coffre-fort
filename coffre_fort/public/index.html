<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
    }
    header {
      flex-shrink: 0;
      background: #1a1a2e;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #0f3460;
    }
    header h1 { font-size: 1.1rem; color: #e2e8f0; }
    .toolbar { display: flex; gap: 10px; align-items: center; }
    #btn-save {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      background: #0f3460;
      color: #fff;
    }
    #btn-save:hover { background: #1a4a7a; }
    #btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 4px;
      display: none;
    }
    #status.ok  { background: #166534; color: #bbf7d0; display: inline-block; }
    #status.err { background: #7f1d1d; color: #fecaca; display: inline-block; }
    #editor-container { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .CodeMirror {
      flex: 1;
      height: 100%;
      font-size: 0.9rem;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    .CodeMirror-scroll { height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>secrets.yml editor</h1>
    <div class="toolbar">
      <span id="status"></span>
      <button id="btn-save" disabled>Save</button>
    </div>
  </header>
  <div id="editor-container"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
